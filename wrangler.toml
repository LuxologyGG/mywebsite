name = "camrone"
main = "src/index.js"
compatibility_date = "2026-01-14"

kv_namespaces = [
  { binding = "UNIQUE_KV", id = "3aaf430ddb2a4ad5a3f273f3f30aa48d" }
]

[assets]
directory = "./public"
binding = "ASSETS"
# not_found_handling is left at its default ("none") so unmatched paths reach the
# Worker; SPA fallback lives in src/routes/spa.js, which serves the shell for
# client-routed pages and keeps a 404 status for genuinely unknown ones.

[vars]
DISCORD_USER_ID = "1042651808557977600"
