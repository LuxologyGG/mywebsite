name = "camrone"
main = "src/index.js"
compatibility_date = "2026-01-14"

kv_namespaces = [
  { binding = "UNIQUE_KV", id = "3aaf430ddb2a4ad5a3f273f3f30aa48d" }
]

[assets]
directory = "./public"
binding = "ASSETS"
# SPA fallback is handled in src/routes/spa.js so that unknown paths can keep a
# 404 status while still rendering the site's own not-found view.
not_found_handling = "none"

[vars]
DISCORD_USER_ID = "1042651808557977600"
